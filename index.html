<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f0" />
    <meta
      name="description"
      content="PantryPilot helps home cooks decide what to cook from the ingredients they already have."
    />
    <title>PantryPilot</title>

    <!--
      Microsoft Clarity, on the live address only.

      The hostname gate is exact rather than a suffix match. Vercel serves this
      app from several addresses — a per-deployment hash URL, preview builds for
      every branch, and localhost during development — and a check like
      endsWith(".vercel.app") would record sessions from all of them into the
      same project. What reaches Clarity should be visitors using the product,
      not me reloading it.

      Runs once: this is a plain script in the document head, so it executes on
      page load and never again. It is deliberately not in a React component,
      where a re-render or a re-mount could append it a second time.

      The project id is exactly as Clarity issued it.
    -->
    <script type="text/javascript">
      if (window.location.hostname === "pantrypilot-phi.vercel.app") {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "ymuad48qp2");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
